/* Layout: a digital edition. Title bar with the edition name and its registers; the Operat's own table of contents as the landing page; a reader with facsimile, transcription and apparatus side by side; figures, stands, statements, events and maps as registers set like journal pages, separated by rules rather than boxes. */
:root {

  --ok: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; --crit-wash: #fbe5e2; --unchecked: #a9afac;
  --grid: #e8e8e4; --axis: #c3c6c0; --shadow: 0 12px 32px rgba(26, 28, 30, .14);

  --header: 56px;
}

    --rule: #2a302e; --rule-2: #3b4441; --accent: #8cc4b0; --accent-wash: #1d2b27;
    --redink: #f07a6f; --corr-wash: #3a3120; --quote: #234238; --band: rgba(240, 122, 111, .14);

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }

button { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }

/* title bar */

/* controls */

.status { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; color: var(--ink-2); }
.statusbar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--grid); gap: 1px; }

.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 3px; font-size: .86rem; }

/* contents */
.title-block { display: grid; gap: 12px; max-width: 880px; }

.colophon dd { margin: 0; color: var(--ink); }

/* reader */
.reader { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: calc(100vh - var(--header)); height: calc(100dvh - var(--header)); }
.rail { border-right: 1px solid var(--rule); background: var(--surface); overflow: auto; min-height: 0; padding: 8px 0 28px; }
.rail-heft { padding: 16px 18px 6px; font-family: var(--serif); font-size: .92rem; font-weight: 600; }

  font-family: var(--serif); font-size: .9rem; color: var(--ink-2); line-height: 1.32; }
.rail-item:hover { color: var(--ink); }

.pages-list button.flag::after { content: ""; position: absolute; top: 1px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--crit); }
.reader-main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 18px; padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--rule); min-height: 54px; flex-wrap: wrap; }
.toolbar .sec { font-family: var(--serif); font-size: 1.08rem; font-weight: 600; min-width: 0; }
.toolbar .sec span { color: var(--muted); font-weight: 400; margin-right: 10px; }

.toolbar .nav { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.toolbar select { display: none; }
.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) 350px; min-height: 0; }
.pane { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; background: var(--surface); border-right: 1px solid var(--rule); }
.pane:last-child { border-right: 0; }
.pane-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 6px 16px; border-bottom: 1px solid var(--rule); min-height: 42px; }

.scroll { overflow: auto; min-height: 0; }
.scan-pane { background: var(--surface-2); }

.facsimile { height: 100%; min-height: 0; }
.zoom-overlay .band { fill: var(--band); stroke: var(--redink); stroke-width: 1.5; }

.zoom-overlay .cell { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.zoom-overlay .line-hl { fill: var(--quote); fill-opacity: .55; stroke: var(--accent); stroke-width: 1.2; }
.zoom-overlay .passage { fill: var(--quote); fill-opacity: .5; stroke: var(--accent); stroke-opacity: .6; stroke-width: 1; }
.zoom-overlay .line-outline { fill: none; stroke: var(--accent); stroke-opacity: .45; stroke-width: 1; }
.zoom-overlay .row-outline { fill: none; stroke: var(--rev-1); stroke-opacity: .55; stroke-width: 1; }

.tx .ln.hl, .tx [data-l].hl { background: var(--accent-wash); }

.x-pane { background: var(--bg); }
@media (max-width: 1500px) {
  .panes { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: minmax(0, 1fr) minmax(0, .6fr); }
  .scan-pane { grid-row: 1 / span 2; }
  .x-pane { grid-column: 2; grid-row: 2; border-top: 1px solid var(--rule-2); border-right: 0; }

}
@media (max-width: 1100px) {
  .reader { grid-template-columns: minmax(0, 1fr); }

}

  .pane { border-right: 0; border-bottom: 1px solid var(--rule); }

}

/* transcription */
.tx-pane { container-type: inline-size; }
.tx { --gutter: 60px; position: relative; padding: 30px 40px 72px var(--gutter); font-family: var(--serif); font-size: 1.04rem; line-height: 1.7; color: var(--ink); max-width: 800px; }
@container (max-width: 520px) { .tx { --gutter: 46px; padding: 18px 16px 40px var(--gutter); } }
.tx h1, .tx h2, .tx h3, .tx h4 { font-family: var(--serif); font-size: 1.1rem; line-height: 1.45; margin: 1.1em 0 .6em; color: var(--ink); text-align: center; font-weight: 600; }
.tx p { margin: 0 0 .9em; }
.tx u { text-decoration-thickness: 1px; text-underline-offset: 3px; }
.tx .red, .grid .red { color: var(--redink); }

  font-size: .84rem; line-height: 1.45; color: var(--ink-2); font-style: italic; }

.tx.lines [data-ln]::before { content: attr(data-ln); position: absolute; left: 0; width: calc(var(--gutter) - 16px); text-align: right; font: 400 .7rem/calc(1.04rem * 1.7) var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; font-style: normal; }

.tx .unc-w { text-decoration: underline dotted var(--accent); text-underline-offset: 3px; }

.tx table th, .tx table td { border: 1px solid var(--rule-2); padding: 3px 7px; vertical-align: top; }
.tx table th { background: var(--surface-2); font-weight: 600; }
.note { color: var(--muted); font-style: italic; padding: 30px 40px; font-family: var(--serif); }

.form-head .form-nr { justify-self: end; font-size: .86rem; color: var(--ink-2); font-family: var(--serif); }
.form-head .ttl { font-family: var(--serif); font-size: 1.06rem; line-height: 1.45; white-space: pre-line; text-align: center; }

.page-notes > div { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; font-size: .88rem; }

.page-notes .t { font-family: var(--serif); font-style: italic; white-space: pre-line; color: var(--ink-2); }
.tx-table { padding: 22px 22px 64px; }
.grid-wrap { overflow-x: auto; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); margin-bottom: 16px; }
