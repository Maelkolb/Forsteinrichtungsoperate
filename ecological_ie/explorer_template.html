/* Layout: an edition viewer. A slim header; the Operat's own table of contents as the landing page; a reader with scan, transcription and extraction side by side; figures, stands, statements, events and maps as registers that lead back into the reader. */
:root {

  --ok: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b; --crit-wash: #fbe5e2; --unchecked: #a9afac;
  --grid: #e6e9e6; --axis: #c3c9c4; --shadow: 0 12px 32px rgba(24, 27, 29, .14);
  --serif: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --header: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101312; --surface: #181c1b; --surface-2: #1d2221; --ink: #e8ece9; --ink-2: #b2bab6; --muted: #858d89;
    --rule: #29302e; --rule-2: #3a4340; --accent: #8cc4b0; --accent-wash: #1e2c28;
    --redink: #f07a6f; --corr: #e8b24a; --corr-wash: #3a3120; --quote: #23423a; --band: rgba(240, 122, 111, .14);
    --rev-1: #3987e5; --rev-2: #d95926; --rev-3: #199e70;
    --harvest-main: #93cbb7; --harvest-inter: #4e8a76; --conifer: #367a42; --broadleaf: #bd8a36;
    --crit-wash: #3a1d1b; --unchecked: #5c6562; --grid: #252b29; --axis: #39413f; --shadow: 0 12px 32px rgba(0, 0, 0, .5);

  }
}
:root[data-theme="dark"] {
  --bg: #101312; --surface: #181c1b; --surface-2: #1d2221; --ink: #e8ece9; --ink-2: #b2bab6; --muted: #858d89;
  --rule: #29302e; --rule-2: #3a4340; --accent: #8cc4b0; --accent-wash: #1e2c28;
  --redink: #f07a6f; --corr: #e8b24a; --corr-wash: #3a3120; --quote: #23423a; --band: rgba(240, 122, 111, .14);
  --rev-1: #3987e5; --rev-2: #d95926; --rev-3: #199e70;
  --harvest-main: #93cbb7; --harvest-inter: #4e8a76; --conifer: #367a42; --broadleaf: #bd8a36;
  --crit-wash: #3a1d1b; --unchecked: #5c6562; --grid: #252b29; --axis: #39413f; --shadow: 0 12px 32px rgba(0, 0, 0, .5);

}
* { box-sizing: border-box; }

/* header */
.top { position: sticky; top: 0; z-index: 20; height: var(--header); background: var(--surface); border-bottom: 1px solid var(--rule); }

/* controls */

input[type="search"] { width: min(300px, 100%); }

.key-rect { width: 11px; height: 11px; border-radius: 2px; display: inline-block; flex: none; }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: .86rem; color: var(--ink-2); }
.statusbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--grid); gap: 1px; }
.statusbar span { display: block; height: 100%; }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: .86rem; }

/* contents */
.title-block { display: grid; gap: 10px; max-width: 900px; }
.title-block .sub { font-family: var(--serif); font-size: 1.2rem; color: var(--ink-2); line-height: 1.4; }
.contents { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 290px; gap: 40px; align-items: start; }

@media (max-width: 760px) { .contents { grid-template-columns: minmax(0, 1fr); gap: 28px; } }
.heft h2 { font-size: 1.1rem; padding-bottom: 8px; border-bottom: 1.5px solid var(--ink); }
.toc-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 64px; gap: 12px; align-items: baseline; padding: 9px 4px; width: 100%;
  border: 0; border-bottom: 1px solid var(--rule); background: none; text-align: left; cursor: pointer; }
.toc-row:hover { background: var(--surface); }
.toc-row .nr { font-family: var(--serif); text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.toc-row .meta .statusbar { width: 100%; }

.toc-scan img { width: 100%; display: block; border: 1px solid var(--rule); border-radius: 3px; background: var(--surface); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 36px; font-size: .9rem; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 16px; }
.facts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* reader */
.reader { display: grid; grid-template-columns: 250px minmax(0, 1fr); height: calc(100vh - var(--header)); height: calc(100dvh - var(--header)); }
.rail { border-right: 1px solid var(--rule); background: var(--surface); overflow: auto; min-height: 0; padding: 10px 0 24px; }
.rail-item { border: 0; background: none; text-align: left; padding: 6px 16px; width: 100%; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px;
  font-size: .87rem; color: var(--ink-2); line-height: 1.3; }
.rail-item:hover { color: var(--ink); background: var(--surface-2); }
.rail-item[aria-current="true"] { color: var(--ink); font-weight: 600; background: var(--accent-wash); }
.rail-item .rid { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.rail-heft { padding: 14px 16px 4px; font-family: var(--serif); font-size: .92rem; font-weight: 600; color: var(--ink); }
.pages-list { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 16px 10px 56px; background: var(--accent-wash); }
.pages-list button { border: 1px solid var(--rule-2); background: var(--surface); border-radius: 4px; min-width: 30px; padding: 1px 6px; font-size: .78rem; cursor: pointer; font-variant-numeric: tabular-nums; color: var(--ink-2); position: relative; }
.pages-list button[aria-current="true"] { border-color: var(--accent); background: var(--accent); color: var(--surface); }
.pages-list button.flag::after { content: ""; position: absolute; top: -3px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 1.5px var(--surface); }
.reader-main { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--rule); min-height: 50px; flex-wrap: wrap; }
.toolbar .sec { font-family: var(--serif); font-size: 1.06rem; font-weight: 600; min-width: 0; }
.toolbar .sec span { color: var(--muted); font-weight: 400; margin-right: 10px; }
.toolbar .where { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.toolbar .nav { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.toolbar .nav .count { font-size: .84rem; color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 48px; text-align: center; }
.toolbar select { display: none; }
.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.12fr) 340px; min-height: 0; }
.pane { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; background: var(--surface); border-right: 1px solid var(--rule); }
.pane:last-child { border-right: 0; }
.pane-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 6px 14px; border-bottom: 1px solid var(--rule); min-height: 40px; }
.pane-bar .title { font-size: .82rem; color: var(--ink-2); font-weight: 600; }
.scroll { overflow: auto; min-height: 0; }
.scan-pane { background: var(--surface-2); }
.scan-pane .scroll { position: relative; }
.scan-inner { position: relative; }
.scan-inner img { display: block; width: 100%; }
.scan-band { position: absolute; left: 0; right: 0; background: var(--band); border-top: 1.5px solid var(--redink); border-bottom: 1.5px solid var(--redink); pointer-events: none; }
.scan-label { position: absolute; border: 1.5px solid var(--redink); border-radius: 2px; background: transparent; padding: 0; cursor: help; }
.scan-label.dim { opacity: .18; }
.scan-label.hit { background: var(--band); }
@media (max-width: 1500px) {
  .panes { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: minmax(0, 1fr) minmax(0, .62fr); }
  .scan-pane { grid-row: 1 / span 2; }
  .x-pane { grid-column: 2; grid-row: 2; border-top: 1px solid var(--rule); border-right: 0; }
  .tx-pane { border-right: 0; }
}
@media (max-width: 1100px) {
  .reader { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .toolbar select { display: block; max-width: 280px; }
  .toolbar .sec { display: none; }
}
@media (max-width: 760px) {
  .reader, .reader-main, .panes { display: block; height: auto; }
  .pane { border-right: 0; border-bottom: 1px solid var(--rule); }
  .scan-pane .scroll { max-height: 70vh; }
  .tx-pane .scroll, .x-pane .scroll { max-height: none; overflow: visible; }
}

/* transcription */
.tx-pane { container-type: inline-size; }
.tx { padding: 28px 36px 64px; font-family: var(--serif); font-size: 1.04rem; line-height: 1.68; color: var(--ink); max-width: 780px; }
@container (max-width: 520px) { .tx { padding: 18px 18px 40px; } }
.tx h1, .tx h2, .tx h3, .tx h4 { font-family: var(--serif); font-size: 1.12rem; line-height: 1.4; margin: 1.1em 0 .6em; color: var(--ink); text-align: center; font-weight: 600; }
.tx p { margin: 0 0 .9em; }
.tx u { text-decoration-thickness: 1px; text-underline-offset: 3px; }
.tx .red, .grid .red { color: var(--redink); }
.tx .marg { float: right; clear: right; display: block; width: 32%; margin: .25em 0 .8em 20px; padding-left: 10px; border-left: 2px solid var(--rule-2);
  font-size: .84rem; line-height: 1.45; color: var(--ink-2); font-style: italic; }
@container (max-width: 560px) { .tx .marg { float: none; width: auto; margin: .3em 0 .8em; } }
.tx .lb { display: inline; }
.tx .hy:not(.lb) { display: none; }
.tx.lines .lb { display: block; }
.tx.lines .hy:not(.lb) { display: inline; }
.tx .unc { font-size: .72em; vertical-align: super; color: var(--accent); font-family: var(--sans); font-weight: 600; padding: 0 1px; }
.tx .unc-w { text-decoration: underline dotted var(--accent); text-underline-offset: 3px; }
.tx .ed { font-style: italic; color: var(--muted); font-family: var(--sans); font-size: .86em; }
.tx .ed::before { content: "⟨"; }
.tx .ed::after { content: "⟩"; }
.tx .sup-text { color: var(--muted); }
.tx del { color: var(--muted); }
.tx mark.corr { background: var(--corr-wash); color: inherit; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; cursor: help; }
.tx.plain mark.corr { background: none; }
.tx .q.on { background: var(--quote); border-radius: 2px; }
.tx .qa.on::before { content: ""; display: inline-block; width: 3px; height: 1.05em; background: var(--accent); vertical-align: -.15em; margin-right: 2px; }
.tx table { border-collapse: collapse; margin: .6em 0 1.1em; font: .88rem/1.4 var(--sans); font-variant-numeric: tabular-nums; }
.tx table th, .tx table td { border: 1px solid var(--rule-2); padding: 3px 7px; vertical-align: top; }
.tx table th { background: var(--surface-2); font-weight: 600; }
.note { color: var(--muted); font-style: italic; padding: 28px 36px; font-family: var(--serif); }
.form-head { display: grid; gap: 4px; margin: 0 0 16px; }
.form-head .form-nr { justify-self: end; font-size: .84rem; color: var(--ink-2); font-family: var(--serif); }
.form-head .ttl { font-family: var(--serif); font-size: 1.08rem; line-height: 1.45; white-space: pre-line; text-align: center; }
.page-notes { margin-top: 18px; display: grid; gap: 10px; }
.page-notes > div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; font-size: .88rem; }
.page-notes .k { color: var(--muted); }
.page-notes .t { font-family: var(--serif); font-style: italic; white-space: pre-line; color: var(--ink-2); }
.tx-table { padding: 20px 20px 60px; }
.grid-wrap { overflow-x: auto; border: 1px solid var(--rule-2); border-radius: 4px; margin-bottom: 14px; background: var(--surface); }
table.grid { border-collapse: collapse; font: 12.5px/1.35 var(--sans); font-variant-numeric: tabular-nums; width: max-content; min-width: 100%; }
table.grid th { background: var(--surface-2); font-weight: 600; color: var(--ink-2); font-size: 11.5px; text-align: center; vertical-align: bottom; padding: 4px 6px; border: 1px solid var(--rule-2); max-width: 150px; }
table.grid td { padding: 3px 7px; border: 1px solid var(--rule); border-top: 0; vertical-align: top; max-width: 320px; }
table.grid td.n { text-align: right; white-space: nowrap; }
table.grid tr.sum td { font-weight: 600; border-top: 1.5px solid var(--ink-2); }
table.grid tr.carry_over td { font-style: italic; color: var(--ink-2); }
table.grid tr.group_header td, table.grid tr.heading td { font-weight: 600; background: var(--surface-2); }
table.grid tr.note td { font-style: italic; color: var(--ink-2); }

table.grid td.rr { background: var(--corr-wash); }

table.grid tbody tr { cursor: pointer; }
table.grid tbody tr:hover td, table.grid tbody tr.sel td { background-color: var(--accent-wash); }
table.grid tr.canon-row th { font-family: var(--mono); font-size: 10.5px; font-weight: 400; color: var(--accent); background: var(--surface); }
.hide-ids table.grid tr.canon-row { display: none; }

/* extraction */
.x { padding: 16px 16px 48px; display: grid; gap: 22px; align-content: start; }
.x section { display: grid; gap: 8px; }
.x h3 { display: flex; justify-content: space-between; gap: 8px; }
.x h3 span { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.x-item { display: grid; gap: 2px; padding: 8px 10px; border: 1px solid var(--rule); border-left: 3px solid var(--rule-2); border-radius: 4px; cursor: pointer; background: var(--surface); text-align: left; width: 100%; }
.x-item:hover, .x-item.on { border-color: var(--accent); background: var(--accent-wash); }
.x-item.event { border-left-color: var(--harvest-main); }

.x-item .s { font-weight: 600; font-size: .92rem; }
.x-item .c { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.x-item .v { font-size: .88rem; font-variant-numeric: tabular-nums; }
.x-item .w { font-size: .8rem; color: var(--muted); }
.x-item.unplaced { cursor: default; }
.pairs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 14px; font-size: .86rem; }
.pairs .h { font-size: .76rem; color: var(--muted); }
.pairs .from { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--rule-2); overflow-wrap: anywhere; }
.pairs .to { overflow-wrap: anywhere; }
.sums { display: grid; gap: 8px; }
.sums .big { font-size: 1.02rem; font-weight: 600; }
.fails { display: grid; gap: 6px; }

/* events */
function parseEdtf(edtf) {

  return { from, to, uncertain: dec };
}
function events() {

    svg.append(svgEl("rect", { x: x(1860.75), y: m.t, width: x(1878) - x(1860.75), height: lane * types.length, class: "ann-band" }));
    svg.append(svgText({ x: x(1860.9), y: m.t - 8, class: "ann-text" }, "Period 1860/61–1877"));
    types.forEach((type, k) => {

      svg.append(svgText({ x: m.l - 12, y: yy + 4, "text-anchor": "end", class: "lane-label" }, EVENT_TYPES[type] || type));
      svg.append(svgEl("line", { x1: m.l, x2: width - m.r, y1: yy, y2: yy, class: "gridline" }));
      for (const e of dated.filter(d => d.type === type)) {

        svg.append(b - a > 13 ? svgEl("rect", { x: a, y: yy - 4, width: b - a, height: 8, rx: 4, fill: "var(--harvest-main)", opacity: e.span.uncertain ? .4 : .85 }) : svgEl("circle", { cx: a + 4.5, cy: yy, r: 5, fill: "var(--harvest-main)", stroke: "var(--surface)", "stroke-width": 2 }));
        const hit = svgEl("rect", { x: a - 8, y: yy - 13, width: Math.max(24, b - a + 16), height: 26, class: "hit", tabindex: "0", role: "button", "aria-label": `${EVENT_TYPES[type] || type}, ${e.date || e.edtf}` });
        attachHit(hit, ev => showTip(ev, `${EVENT_TYPES[type] || type}, ${e.date || e.edtf}`, e.place ? [{ label: e.place, value: "" }] : [], e.extent || ""), () => openReader(e.u, e.p, { q: `e${e.i}` }));
        svg.append(hit);
      }
    });
    host.replaceChildren(svg);
  });
  const areas = (unit, v) => REVIERE.map(r => { const hits = D.obs.rows.map((o, i) => [o, i]).filter(([o]) => o[0] === unit && o[4] === v && o[9] === r);
    return { r, v: hits.reduce((s, [o]) => s + (o[6] ?? o[5] ?? 0), 0), refs: hits.map(([, i]) => i) }; });
  const areaPanel = (title, caption, list) => { const max = Math.max(...list.map(r => r.v), 1);
    return el("section", { class: "panel" }, el("h2", {}, title), el("div", { style: "display:grid;gap:10px" }, list.map(r => el("button", { class: "area-row", onclick: () => openValues(r.refs, `${title}, ${r.r}`) },
      el("span", {}, r.r), el("span", { class: "track" }, el("span", { class: "fill", style: `width:${r.v / max * 100}%;background:${REV_COLOR[r.r]}` })), el("b", { class: "num", style: "text-align:right" }, `${nf(r.v, 1)} ha`)))),
      el("p", { class: "caption" }, caption)); };
  const damage = D.statements.map((s, i) => ({ ...s, i })).filter(s => s.cat === "damage_event" && !D.events.some(e => e.quote === s.quote));
  const entry = (when, sub, quote, meta, u, p, q) => el("div", { class: "item" }, el("div", { class: "when" }, when, el("span", {}, sub)),
    el("div", { class: "body" }, el("p", { class: "quote" }, quote), el("div", { class: "meta" }, joinUnique(meta))),
    el("div", { class: "src" }, p != null ? el("button", { class: "link", onclick: () => openReader(u, p, { q }) }, `${sectionRef(u)}, p. ${page(u, p)?.num ?? p}`) : sectionRef(u)));

        damage.map(s => entry(s.time || "undated", s.subj, s.quote, [s.place, s.val ? `${s.val} ${s.vu || ""}` : ""], s.u, s.p, String(s.i))))))];
}
