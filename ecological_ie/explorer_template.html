<style>

function columnChart(host, cfg) {
  const width = Math.max(300, host.clientWidth), height = cfg.height || 300;

      svg.append(svgText({ x: band0 + band / 2 - 4, y: m.t - 10, class: "ann-text", "text-anchor": "end" }, a.label));

function lineChart(host, cfg) {

  });

function histogram(host, values, color, cfg) {

  const iw = width - m.l - m.r, ih = height - m.t - m.b;
  const counts = cfg.bins.map(([a, b]) => values.filter(v => v >= a && v < b).length);
  const ticks = niceTicks(Math.max(...counts, 1), 3), top = ticks[ticks.length - 1];
  const band = iw / cfg.bins.length, bw = Math.min(24, band - 2), y = v => m.t + ih - v / top * ih;

  for (const t of ticks) { svg.append(svgEl("line", { x1: m.l, x2: width - m.r, y1: y(t), y2: y(t), class: t === 0 ? "baseline" : "gridline" }));

function parseEdtf(edtf) {

  const to = m[5] ? +(m[5] + (m[6] === "X" ? "9" : m[6])) + .99 : decade ? from + 9.99 : from + (m[3] ? .08 : .99);

}

    for (let yr = 1840; yr <= 1890; yr += 10) { svg.append(svgEl("line", { x1: x(yr), x2: x(yr), y1: m.t, y2: height - m.b, class: "gridline" }));
      svg.append(svgText({ x: x(yr), y: height - 10, "text-anchor": "middle" }, yr)); }
    svg.append(svgEl("rect", { x: x(1860.75), y: m.t, width: x(1878) - x(1860.75), height: lane * types.length, class: "ann-band" }));
    svg.append(svgText({ x: x(1860.9), y: m.t - 9, class: "ann-text" }, "past period 1860/61–1877"));
    types.forEach((type, k) => {
      const yy = m.t + k * lane + lane / 2;
      svg.append(svgText({ x: m.l - 12, y: yy + 4, "text-anchor": "end", style: "fill:var(--ink-2);font-size:12.5px" }, EVENT_TYPES[type] || type));
      svg.append(svgEl("line", { x1: m.l, x2: width - m.r, y1: yy, y2: yy, class: "gridline" }));
      for (const e of dated.filter(d => d.type === type)) {
        const a = x(e.span.from), b = Math.max(x(e.span.to), a + 9);
        svg.append(b - a > 13 ? svgEl("rect", { x: a, y: yy - 5, width: b - a, height: 10, rx: 5, fill: "var(--harvest-main)", opacity: e.span.uncertain ? .4 : .85 })
          : svgEl("circle", { cx: a + 4.5, cy: yy, r: 5.5, fill: "var(--harvest-main)", stroke: "var(--sheet)", "stroke-width": 2 }));
        const hit = svgEl("rect", { x: a - 8, y: yy - 13, width: Math.max(24, b - a + 16), height: 26, class: "hit", tabindex: "0", role: "button", "aria-label": `${EVENT_TYPES[type] || type}, ${e.date || e.edtf}` });
        attachHit(hit, ev => showTip(ev, `${EVENT_TYPES[type] || type} · ${e.date || e.edtf}`, [{ label: e.place || e.rev || e.u, value: "" }], e.extent || "click for the quote"),
          () => openQuote(e, `${EVENT_TYPES[type] || type}, ${e.date || ""}`));
        svg.append(hit);
      }
    });
    host.replaceChildren(svg);
  });
  const areaRows = (unit, variable) => REVIERE.map(r => {
    const rows = D.obs.rows.map((x, i) => [x, i]).filter(([x]) => x[0] === unit && x[4] === variable && x[9] === r);
    return { r, v: rows.reduce((s, [x]) => s + (x[6] ?? x[5] ?? 0), 0), refs: rows.map(([, i]) => i) };
  });
  const damageStatements = D.statements.filter(s => s.cat === "damage_event" && !D.events.some(e => e.quote === s.quote));
  const eventItem = e => el("div", { class: "item" },
    el("div", { class: "when" }, e.date || e.edtf || "undated", el("div", { class: "sub" }, EVENT_TYPES[e.type] || e.type)),
    el("div", { class: "body" }, el("p", { class: "quote" }, e.quote),
      el("div", { class: "meta" }, e.place ? el("span", {}, e.place) : "", e.extent ? el("span", {}, e.extent) : "",
        el("button", { class: "btn link", onclick: () => openQuote(e, `${EVENT_TYPES[e.type] || e.type}, ${e.date || ""}`) }, `${e.u} · open page`))));
  return [
    head("Disturbances", "Storm, beetle, snow and frost", "Dated events named in the Erörternde Darstellung, the Grundlagenprotokoll and the examination protocol, next to the areas the tables record as laid bare."),
    el("section", { class: "card" },
      el("div", { class: "card-head" }, el("div", {}, el("div", { class: "eyebrow" }, "From the texts"), el("h2", {}, `${dated.length} dated events`),
        el("p", { class: "card-note" }, "Dots are single dates, bars periods; pale bars are dated only to the decade. Click an event for its quote and page."))),
      timeline.host),
    el("div", { class: "grid-2" },
      areaCard("I-17 · Abgleichung der Angriffsflächen", "Cutting areas laid bare instead", areaRows("I-17", "area_became_bare"), "Areas planned for cutting in the past period that became bare (blößig) through wind and beetle, in ha."),
      areaCard("I-13 · Verzeichnis der nicht eingereihten Flächen", "Areas left out of the plan", areaRows("I-13", "area_not_assigned"), "Windthrow and beetle gaps, mostly at high elevation and hard to reforest, in ha.")),
    el("section", { class: "card" },
      el("div", { style: "display:grid;gap:4px" }, el("div", { class: "eyebrow" }, "Quotes"), el("h2", {}, "What the foresters wrote")),
      el("div", { class: "items" }, dated.map(eventItem), undated.map(eventItem),
        damageStatements.map(s => el("div", { class: "item" },
          el("div", { class: "when" }, s.time || "undated", el("div", { class: "sub" }, s.subj)),
          el("div", { class: "body" }, el("p", { class: "quote" }, s.quote),
            el("div", { class: "meta" }, s.place ? el("span", {}, s.place) : "", s.val ? el("span", {}, `${s.val} ${s.vu || ""}`) : "",
              el("button", { class: "btn link", onclick: () => openQuote(s, s.subj) }, `${s.u} · open page`))))))),
    footer()];
}
function areaCard(eyebrow, title, rows, note) {
  const max = Math.max(...rows.map(r => r.v), 1);
  return el("section", { class: "card" },
    el("div", { style: "display:grid;gap:4px" }, el("div", { class: "eyebrow" }, eyebrow), el("h2", {}, title), el("p", { class: "card-note" }, note)),
    el("div", { style: "display:grid;gap:10px" }, rows.map(r => el("button", { class: "area-row", onclick: () => openObservations(r.refs, `${title} · ${r.r}`), "aria-label": `${r.r}: ${nf(r.v, 1)} ha` },
      el("span", {}, r.r), el("span", { class: "track" }, el("span", { class: "fill", style: `width:${r.v / max * 100}%;background:${REV_COLOR[r.r]}` })),
      el("b", { class: "num", style: "text-align:right" }, `${nf(r.v, 1)} ha`)))));
}

/* statements */
function statements() {
  const state = { cat: "all", rev: "all", q: "", limit: 60 };
  const counts = {}; for (const s of D.statements) counts[s.cat] = (counts[s.cat] || 0) + 1;
  const list = el("div", { class: "items" });
  const more = el("button", { class: "btn", onclick: () => { state.limit += 60; draw(); } }, "Show more");
  const catChips = el("div", { class: "controls" });
  for (const [key, label, count] of [["all", "All", D.statements.length], ...Object.entries(CATEGORIES).filter(([k]) => counts[k]).map(([k, l]) => [k, l, counts[k]])])
    catChips.append(el("button", { class: "chip", "aria-pressed": key === "all" ? "true" : "false", onclick: e => {
      state.cat = key; state.limit = 60; for (const b of catChips.children) b.setAttribute("aria-pressed", b === e.currentTarget ? "true" : "false"); draw(); } }, label, el("span", { class: "count" }, count)));
  const revSelect = el("select", { id: "st-rev", "aria-label": "Revier" }, el("option", { value: "all" }, "All Reviere"), REVIERE.map(r => el("option", { value: r }, r)));
  const search = el("input", { type: "search", id: "st-search", placeholder: "Search, e.g. Fichte, Windbruch, Weide", "aria-label": "Search statements" });
  revSelect.addEventListener("change", () => { state.rev = revSelect.value; state.limit = 60; draw(); });
  search.addEventListener("input", () => { state.q = search.value.trim().toLowerCase(); state.limit = 60; draw(); });
  const count = el("p", { class: "muted", style: "font-size:.86rem" });
  function draw() {
    const filtered = D.statements.filter(s => (state.cat === "all" || s.cat === state.cat) && (state.rev === "all" || s.rev === state.rev)
      && (!state.q || [s.subj, s.attr, s.val, s.quote, s.place, s.species].join(" ").toLowerCase().includes(state.q)));
    count.textContent = `${filtered.length} statements`;
    list.replaceChildren(...filtered.slice(0, state.limit).map(s => el("div", { class: "item" },
      el("div", { class: "when" }, s.time || "–", el("div", { class: "sub" }, CATEGORIES[s.cat] || s.cat)),
      el("div", { class: "body" },
        el("div", {}, el("b", {}, s.subj), s.attr ? ` · ${s.attr}` : "", s.val ? el("span", { class: "num" }, ` · ${s.val}${s.vu ? " " + s.vu : ""}`) : ""),
        el("p", { class: "quote" }, s.quote),
        el("div", { class: "meta" }, el("span", { class: "tag" }, s.status), s.place ? el("span", {}, s.place) : "", s.rev ? el("span", {}, s.rev) : "",
          el("button", { class: "btn link", onclick: () => openQuote(s, s.subj) }, `${s.u} · open page`))))));
    more.hidden = filtered.length <= state.limit;
  }
  draw();
  return [
    head("Statements", "What the reports say about the forest", `${D.statements.length} single statements from the Erörternde Darstellung (I-00), the protocols (I-01, I-21) and the text pages of the plans, each with its verbatim quote, place, date and whether it describes, plans or forbids.`),
    el("section", { class: "card" }, catChips, el("div", { class: "controls" }, revSelect, search, count), list, more),
    footer()];
}

/* maps */
function maps() {
  let current = 0, zoom = 1, showLabels = true, q = "";
  const tabsRow = el("div", { class: "map-tabs" });
  const viewer = el("div", { class: "map-view" });
  const info = el("div", { style: "display:grid;gap:6px" });
  const toggle = el("button", { class: "chip", "aria-pressed": "true", onclick: () => { showLabels = !showLabels; toggle.setAttribute("aria-pressed", showLabels ? "true" : "false"); draw(); } }, "Label boxes");
  const search = el("input", { type: "search", id: "map-search", placeholder: "Find a label, e.g. Rachel", "aria-label": "Find a label" });
  search.addEventListener("input", () => { q = search.value.trim().toLowerCase(); draw(); });
  const dynamic = el("div", { style: "display:grid;gap:14px" });
  const side = el("div", { class: "map-side" },
    el("div", { class: "controls" }, el("div", { class: "seg" },
      el("button", { "aria-label": "Zoom out", onclick: () => { zoom = Math.max(1, zoom - .5); draw(); } }, "−"),
      el("button", { "aria-label": "Zoom in", onclick: () => { zoom = Math.min(5, zoom + .5); draw(); } }, "+")), toggle),
    search, dynamic);
  function focusLabel(l) {
    const m = D.maps[current];
    zoom = Math.max(zoom, 2.5); q = l[0].toLowerCase(); search.value = l[0]; draw();
    requestAnimationFrame(() => { const inner = viewer.firstChild; viewer.scrollTo({ left: l[2] / m.w * inner.offsetWidth - viewer.clientWidth / 2, top: l[3] / m.h * inner.offsetHeight - viewer.clientHeight / 2 }); });
  }
  function draw() {
    const m = D.maps[current], pg = page(m.u, m.p);
    for (const [i, b] of [...tabsRow.children].entries()) b.setAttribute("aria-pressed", i === current ? "true" : "false");
    info.replaceChildren(el("div", { class: "eyebrow" }, `${m.u} · ${UNIT_TITLES[m.u]}`), el("h2", {}, m.title), el("p", { class: "card-note" }, [m.type, m.date, m.scale].filter(Boolean).join(" · ")));
    const inner = el("div", { class: "map-inner", style: `width:${zoom * 100}%` }, el("img", { src: pg.img, alt: m.title }));
    const matches = [];
    m.labels.forEach((l, i) => {
      const hit = q && l[0].toLowerCase().includes(q);
      if (hit) matches.push(i);
      if (!showLabels) return;
      const b = el("button", { class: `lab${q && !hit ? " dim" : ""}${hit ? " hit" : ""}`, "aria-label": l[0],
        style: `left:${l[2] / m.w * 100}%;top:${l[3] / m.h * 100}%;width:${(l[4] - l[2]) / m.w * 100}%;height:${(l[5] - l[3]) / m.h * 100}%` });
      b.addEventListener("pointermove", e => showTip(e, l[0], [{ label: l[1].replace(/_/g, " "), value: l[6] }]));
      b.addEventListener("pointerleave", hideTip);
      inner.append(b);
    });
    const scroll = [viewer.scrollLeft, viewer.scrollTop];
    viewer.replaceChildren(inner);
    viewer.scrollLeft = scroll[0]; viewer.scrollTop = scroll[1];
    const byClass = {}; for (const l of m.labels) byClass[l[1]] = (byClass[l[1]] || 0) + 1;
    const listed = q ? matches.map(i => m.labels[i]) : m.labels.filter(l => ["settlement", "forest_district", "water", "mountain", "trift_structure"].includes(l[1]));
    dynamic.replaceChildren(
      el("p", { class: "muted", style: "font-size:.86rem" }, `${m.labels.length} labels: ` + Object.entries(byClass).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, v]) => `${v} ${k.replace(/_/g, " ")}`).join(", ")),
      m.legend.length ? el("div", { style: "display:grid;gap:4px" }, el("div", { class: "eyebrow" }, "Legend"), m.legend.map(([sym, meaning]) => el("div", { style: "font-size:.88rem" }, el("b", {}, meaning), el("span", { class: "muted" }, ` · ${sym}`)))) : "",
      el("div", { class: "eyebrow" }, q ? `${matches.length} matches` : "Places, districts, waters"),
      el("div", { class: "label-list" }, listed.slice(0, 150).map(l => el("button", { onclick: () => focusLabel(l) }, el("span", {}, l[0]), el("span", { class: "muted" }, l[1].replace(/_/g, " "))))));
  }
  D.maps.forEach((m, i) => { const pg = page(m.u, m.p); tabsRow.append(el("button", { class: "map-tab", onclick: () => { current = i; zoom = 1; q = ""; search.value = ""; viewer.scrollTo(0, 0); draw(); } },
    el("img", { src: pg.img, alt: "", loading: "lazy" }), el("span", {}, `${m.u} · ${UNIT_TITLES[m.u]}`))); });
  draw();
  return [
    head("Maps", "Four sheets, read label by label", "Every label was read on overlapping zoomed tiles and placed on the sheet. Search a place name to find it, hover a box for the reading. The 1200 px images limit what can be read on the large overview sheet (I-08)."),
    tabsRow,
    el("section", { class: "card" }, info, el("div", { class: "map-layout" }, viewer, side)),
    footer()];
}

/* sources */
function sources() {
  const detail = el("div");
  const showUnit = u => {
    const keys = Object.keys(D.pages).filter(k => k.startsWith(u.id + "/")).sort((a, b) => +a.split("/")[1] - +b.split("/")[1]);
    detail.replaceChildren(el("section", { class: "card" },
      el("div", { style: "display:grid;gap:4px" }, el("div", { class: "eyebrow" }, `${u.id} · ${u.heft} ${u.nr}`), el("h2", {}, u.title)),
      el("p", { class: "card-note" }, u.summary),
      Object.keys(u.checks).length ? statusLegend(u.checks) : "",
      el("div", { class: "thumbs" }, keys.map(k => { const p = +k.split("/")[1]; const pg = page(u.id, p);
        return el("button", { class: "thumb", onclick: () => openPage(u.id, p), "aria-label": `Open ${pg.pid}` },
          pg.img ? el("img", { src: pg.img, alt: "", loading: "lazy" }) : el("div", { style: "aspect-ratio:3/4;display:grid;place-items:center;color:var(--muted);font-size:.8rem" }, "no image"),
          el("span", {}, `p. ${pg.num}`)); }))));
    detail.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  const rows = D.units.map(u => el("div", { class: "unit-row", role: "button", tabindex: "0", onclick: () => showUnit(u), onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showUnit(u); } } },
    el("div", { class: "id" }, u.id),
    el("div", { style: "display:grid;gap:2px;min-width:0" }, el("div", { class: "t" }, u.title),
      el("div", { class: "s" }, `${u.pages} pages · ${[u.kinds.Te && u.kinds.Te + " text", u.kinds.Ta && u.kinds.Ta + " table", u.kinds.Ka && u.kinds.Ka + " map"].filter(Boolean).join(", ")}`)),
    el("div", { class: "s" }, Object.keys(u.checks).length ? `${nf(Object.values(u.checks).reduce((a, b) => a + b, 0), 0)} sums checked` : "text or map"),
    el("div", {}, statusBar(u.checks))));
  return [
    head("Sources", "24 sections of the Operat", "The items of the table of contents (A 383 I, p. 2) that are linked to pages. The bar shows how the readings of each table section fared against its own sums. Open a section to page through its scans."),
    el("section", { class: "card" }, statusLegend(null), el("div", { class: "units" }, rows)),
    detail, footer()];
}

function footer() {
  return el("footer", { class: "foot" },
    el("span", {}, "Waldstandsrevision Ilzertrift-Komplex 1878/90 · Regierung von Niederbayern, Kammer der Forsten, A 383 I – A 385"),
    el("span", {}, `Data package ${D.meta.built} · ${nf(D.meta.counts.cells, 0)} table cells`),
    PACKAGE_LINK ? el("a", { href: PACKAGE_LINK }, "Data package (CSV)") : "",
    el("span", {}, "Readings by Gemini 3.8 Flash from scan and transcript; unit specs and checks by Claude Code"));
}

render((location.hash ? location.hash.slice(1) : store("ilz-view")) || "overview");
</script>
