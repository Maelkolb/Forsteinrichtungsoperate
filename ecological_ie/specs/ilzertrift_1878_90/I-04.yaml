notes: |
  Reading order: the table pages carry the page numbers 1–11 (positions 2–4, 6–9 = pages 1–7; positions 21–24 = pages
  8–11, folios 379–382), so the reading order puts them together before the texts; the first Erläuterungen (folios
  368–378) are bound between table pages 7 and 8. Both texts read in ascending folio order (368→378 and 383→393, checked
  by the continuing sentences across page breaks); the annotated order (393 down to 376, then 368–375) is wrong.
  Positions 21–24 have no image – rely on the transcript. Position 5 duplicates position 4 (same opening photographed
  with a pasted slip) and is skipped. The headers are handwritten and faint: 'Nummer des Wegprotokolls' and 'Ziffer der
  Nivellementstabelle' (two narrow columns between Lauf. Nummer and Distr. Nummer) are read with some doubt; the HTR
  turns M. | Pf. into 'fl. | kr.' on some pages – the whole plan is in Mark. On Begangsteige pages the cost per metre
  is only Pfennig (13, 15, 20 Pf). Roads are described in terms of compartments, not stands: no description column.
