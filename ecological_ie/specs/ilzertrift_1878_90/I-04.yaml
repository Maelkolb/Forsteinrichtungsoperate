forms:
  wb:
    name: Spezieller Wegbauplan 1878/89 (hand-ruled table)
    description: |
      One row per road project (new construction, correction or maintenance). Section headings inside the table set key
      other: 'Wegnetzprojectirung', 'Holzabfuhrwege – Neubauten', 'Unterhaltung der Holzabfuhrwege', 'Ziehbahnen'
      (width 1,20–1,50 m), 'Waldbegangsteige – Neubauten', 'Begehungswege – Unterhaltung', 'Zusammenstellung'. Red
      headings 'Revier Klingenbrunn', 'Revier St. Oswald', 'Revier Schoenau' set revier. The Distr./Abtheilung cells list
      all compartments a road crosses on several lines (Roman Distrikt number on the first of its lines, Abtheilung
      numbers and names below): keep them in one cell, lines joined with '; '. The road name and the construction details
      (width, Grundbau, Gefälle) are in 'Auszuführende Wege'. Kosten im Ganzen = Länge × Kosten einzeln (cost per metre;
      a product, not a sum); maintenance lines without length give only the total. Money in Mark | Pfennig (M. | Pf.).
      Page sums at the bottom ('1. Seite', '2. Seite') sum the length and the total cost (row_type sum); summary blocks
      repeat earlier page sums ('3. Seite', '2. „', '1. „' → carry_over) and give 'Summa Holzabfuhrwege Unterhaltung /
      Neubauten', 'Summa Ziehbahnen', 'Sa Waldbegehungswege' (sum). Bemerkungen give the necessity of the road and refer
      to numbered notes '1)'…'12a)'; pasted slips carry later revision notes (red or pencil additions → red / row note).
      The Ausführung columns record the year and actual cost of execution; on table page 1 the actual costs of the
      Wegnetzprojectirung are listed per Forstamt and Revier with 'in Sa.' (note rows with values in exec_cost, then sum).
    columns:
      - {id: run_no, label: "Lauf. Nummer", type: label, meaning: "running number of the road project"}
      - {id: protocol_no, label: "Nummer des Wegprotokolls", type: text,
         meaning: "number of the road in the commission protocol of 14 July 1879 (e.g. 'II. 5.', 'A. 3.')"}
      - {id: levelling_no, label: "Ziffer der Nivellementstabelle", type: text,
         meaning: "number of the road line in the levelling tables of the road-network survey 1878/79"}
      - {id: district_nos, label: "Distr. Nummer", type: text,
         meaning: "Distrikt numbers (Roman) crossed by the road, one per line"}
      - {id: compartment_nos, label: "Abtheilung › Nummer", type: text,
         meaning: "Abtheilung numbers crossed by the road, several per Distrikt"}
      - {id: compartment_names, label: "Abtheilung › Name", type: text,
         meaning: "names of the Abtheilungen crossed by the road"}
      - {id: length, label: "Länge in Metern", type: number, unit: m, variable: road_length}
      - {id: works, label: "Auszuführende Wege (Wegbauten)", type: text,
         meaning: "road name and kind of work: new road, correction, maintenance; width, foundation, gradient"}
      - {id: unit_cost, label: "Kosten › einzeln › M.", type: pair_major, unit: M, variable: road_cost_per_metre,
         meaning: "cost per running metre"}
      - {id: unit_cost_pf, label: "Kosten › einzeln › Pf.", type: pair_minor, of: unit_cost, mode: base100}
      - {id: total_cost, label: "Kosten › im Ganzen › M.", type: pair_major, unit: M, variable: road_cost,
         meaning: "planned total cost for the period"}
      - {id: total_cost_pf, label: "Kosten › im Ganzen › Pf.", type: pair_minor, of: total_cost, mode: base100}
      - {id: remarks, label: "Bemerkungen", type: text,
         meaning: "necessity and justification of the road, execution notes, references to numbered notes"}
      - {id: exec_year, label: "Ausführung › Jahr", type: year}
      - {id: exec_cost, label: "Ausführung › Kosten › M.", type: pair_major, unit: M, variable: road_cost_actual,
         meaning: "actual cost of the executed work"}
      - {id: exec_cost_pf, label: "Ausführung › Kosten › Pf.", type: pair_minor, of: exec_cost, mode: base100}
    observations: {scope_keys: [revier]}
