unit: I-04
title: Wegbauplan
summary: |
  Beilage I. 4 (Forstamt Schönberg): special road building plan (Spezieller Wegbauplan) of the Reviere Klingenbrunn,
  St. Oswald and Schönau for the period 1878/89, with two explanatory texts. The table (hand-ruled, pages 1–11, signed
  Schönberg 15 September 1880) has one row per road project – projecting of the road network, new timber-haulage roads
  (Holzabfuhrwege), their maintenance, skid trails (Ziehbahnen), forest footpaths (Waldbegangsteige) and their
  maintenance – with the compartments the road crosses, length in metres, cost per metre and total cost in Mark/Pfennig,
  remarks on necessity and the execution record. The texts 'Erläuterungen zur Begründung des speziellen Wegebauplans'
  (8 May 1880, positions 10–20) and 'Erläuterungen' (20 September 1880, positions 25–35) argue for the roads with the
  timber market (Trift losses on Ilz and Regen, railway Plattling–Eisenstein with station Zwiesel, planned line
  Zwiesel–Passau), the Distriktsstraße Klingenbrunn–Frauenau and list the timber quantities (Ster) from the stands of the
  felling plan that each planned road will carry.
