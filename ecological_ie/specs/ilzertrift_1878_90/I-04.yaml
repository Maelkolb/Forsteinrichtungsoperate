notes: |
  Reading order: the table pages carry the page numbers 1–11 (positions 2–4, 6–9 = pages 1–7; positions 21–24 = pages
  8–11, folios 379–382), so the reading order puts them together before the texts; the first Erläuterungen (folios
  368–378) are bound between table pages 7 and 8. Both texts read in ascending folio order (368→378 and 383→393, checked
  by the continuing sentences across page breaks); the annotated order (393 down to 376, then 368–375) is wrong.
  Positions 21–24 checked against the 200 dpi scans (2026-10-05): handwritten page numbers 8–11 on folios 379–382,
  running numbers continue 35 → 36 from page 7 (position 9), and the Zusammenstellung repeats Summa Holzabfuhrwege
  148150 (page 6) and Summa Ziehbahnen 12000 (page 7), so the reading order 1–9, 21–24 holds. The form and its column
  heads are the same as on pages 1–7. Sum check (page 8): 488,80 + 484,90 + 729,30 + 551,20 + 503,10 + 500 + 337,50
  + 382,50 + 331,50 + 405 = 4713,80 ('1. Seite') → base 100. The HTR misreads some numbers there (run 36 length
  2760 for 3760, run 43 302 for 382,50, '2. Seite' 30030 for 30010). Position 5 duplicates position 4 (same opening
  photographed with a pasted slip) and is skipped. The headers are handwritten and faint: 'Nummer des Wegprotokolls'
  and 'Ziffer der Nivellementstabelle' (two narrow columns between Lauf. Nummer and Distr. Nummer) are read with some
  doubt (clearest on pages 9–10: 'Num. d. Wegprotokolls', 'Ziff. der Nivellements-Tabelle'); on pages 8–9 the
  Ziffer values match the numbers of the 'Verzeichnis der ausgesteckten Weglinien' (I-19 position 3); the HTR turns M. | Pf.
  into 'fl. | kr.' on some pages – the whole plan is in Mark. On Begangsteige pages the cost per metre is only
  Pfennig (13, 15, 20, 50 Pf). Roads are described in terms of compartments, not stands: no description column.
