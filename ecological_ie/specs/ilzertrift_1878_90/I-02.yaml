unit: I-02
title: Spezieller Wirtschaftsplan
summary: 'Beilage I. 2 (Form No. VII, Forstamt Schönberg): special management plan (Specieller Wirthschafts-Plan) of the

  Wirthschaftscomplex Reviere Schönau, St. Oswald and Klingenbrunn for the period 1878–1889, Hochwald in 144-year

  rotation. The first page holds the title and the Wirthschaftsregeln (silvicultural rules); the table pages list one row

  per Abtheilung/Unterabtheilung scheduled for a cut, grouped by kind of use (Hauptnutzungen: Angriffshiebe,

  Nachhauungen, Auszugshauungen, zufällige Ergebnisse; Zwischennutzungen: Durchforstungen, Reinigungen, zufällige

  Ergebnisse) and within each by Revier, with area, dominant species, age, yield per hectare and planned harvest. Areas

  are hectares with three decimals (the printed ''Tagwerk'' is struck through and replaced by ''Hektar'' on some pages and

  left standing on others), yields and harvests in Ster (Raummeter) and hundreds of faggots (Wellen-Hundert, nearly

  always empty). Positions 1–31 (folios 114–146) are the complete plan, signed Schönberg 28 September 1881; positions

  32–48 are fragments of further copies that repeat stands of positions 2–31: a title page ''Ins Operat v. 1878''

  (folio 148), an extract for Revier St. Oswald (161–169) and the end of a complex-wide copy (183–189) with struck-out

  original harvest figures.

  '
