unit: I-11
title: Periodentabelle
summary: |
  Beilage I. 11, Form F. No. 6 "Uebersicht des Material-Ertrages in den verschiedenen Wirthschafts-Perioden"
  (Periodentabelle) of the Waldstandsrevision for the Ilzertrift-Komplex, Forstamt Schönberg. Every scan shows a whole
  opened spread. The left page has the keys, the area and the stand description. The middle page and the fold-out
  right page have age, growing stock, increment, expected final yield and six 22-year periods (I. 1883/1904 …
  VI. 1993/2014), each with the cut area (Angriffsfläche, Tagw. | Dz.) and Haubarkeitsertrag in Klafter.
  One row is one Unterabtheilung (Litt. a, b, c …). The long description (Lage, Boden, Holzbestand,
  Bewirthschaftung) is written once per Abtheilung. Only Revier St. Oswald is in the unit: a separate 3-page block
  (Seite 1–3, Distrikte I Seewald and IV Plattenhausen, Summe 893 Tagw. 47 Dez.), then the main block Seite 1–31
  (Distrikte II, III, V–VIII, total 7323 Tagw. 82 Dez.), and finally the closing "Zusammenstellung der 3 Reviere des
  Ilzertrift-Complexes" signed by the Königl. Forstamt Schönberg.
