notes: |
  Reading order: the position order (= archive order A 383 II 3, 6–8, 41–71, 105) is the real order and is set
  explicitly. The annotation order (3, 6, 7, 8, 41–49, 105, 71→64, 50–63) was wrong. The "Seite" numbers run 1–3 on
  archive pages 6–8 (block A) and 1–31 on 41–71 (block B; Seite N = archive page − 40, page 71 is the recap). Page 105
  is the closing summary.
  Block A (Distrikte I Seewald, IV Plattenhausen; 893 Tagw. 47 Dez.) is NOT part of the St. Oswald total 7323 | 82 used
  in the Ilzertrift summary on p. 105. It is probably a separate management unit of Revier St. Oswald. Archive pages
  4–5, 9–40 and 72–104 (presumably Reviere Schönau and Klingenbrunn) are not in this unit.
  Doubtful headers (low-resolution scans): the period years are read as 18 83/04, 19 05/26, 19 27/48, 19 49/70,
  19 71/92 and "18" corrected to 19/20 93/14, i.e. 22-year periods 1883–2014; the digits are tiny, but the sequence
  83, 05, 27, 49, 71, 93 is consistent. The HTR readings "18 33/42", "1855/64" etc. are wrong. Other doubtful headers:
  the narrow rotated column after "Fläche" (unreadable; it holds the areas of Filz/Wiese/Blöße); "dermaliger" (HTR:
  "damaliger"); the first word of the rotated increment header; the period-I sub-block "Weg-Räumungen (?)" (HTR:
  "Wege-Räumungen", "Wege-Bauungen") and the meaning of its letters N / P / R. "Haubarkeitsertrag" is garbled in the
  HTR as "Grubenhiebe", "Grüber Ertrag" or "Hauerertrag".
