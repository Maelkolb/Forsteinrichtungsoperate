forms:
  f6:
    name: "F. No. 6 – Uebersicht des Material-Ertrages in den verschiedenen Wirthschafts-Perioden (Periodentabelle)"
    description: |
      Whole double spread in one image: left page = keys, area, narrow area column and "Beschreibung des
      Holzbestandes"; middle page = ages, growing stock, increment, Haubarkeitsertrag per Tagw. and periods I–III;
      right (fold-out) page = periods IV–VI. Read each row straight across all three parts.
      Rows: "Revier Sct. Oswald" at the top of the first page of each block is a group_header (sets_key revier).
      The Distrikt No. (Roman) and name are written once at the first Abtheilung of the Distrikt; the Abtheilung No.
      once at its first line. The description text belongs to the Abtheilung line (compartment without Litt.). The
      Unterabtheilungen a, b, c … follow below it, each with its own area and period entries. Give each Unterabtheilung
      as its own data row and repeat the keys.
      Short texts next to an Unterabtheilung ("Filz", "Wiese", "Blöße", "Wechselwiese") describe non-wooded parts. Their
      area is written as Tagw.Dz. in one cell of the narrow column right of "Fläche". The small number written in the
      left margin / district columns beside the last Unterabtheilung (e.g. "163,30", "140,22") is the total area of
      the Abtheilung, NOT a district number: put it into the row note. An asterisk (*) before some Litt. also goes
      into the note.
      Period I has an extra sub-block (header read as "Weg-Räumungen (?)") with "Bezeichnung" (letters N, P or R)
      and "Material-Anfall" in Klafter. When a row has several letter lines (N / P / R), give each further line as its
      own data row with the same keys and only these two cells filled.
      Bottom of each page: "Seite N" row with the page sums (row_type sum). Page 3 of block A and pages 30/31 of
      block B carry recap rows "Seite 3, 2, 1" / "Seite 30 … 1" (row_type carry_over) and totals "Summe",
      "S. I", "S. II", "S. Tot." (row_type sum).
      Closing page (A 383 II 105): rows for Reviere Schönau, St. Oswald, Klingenbrunn (area in up to three lines,
      Material-Anfall split into N / P / R lines), a Summa row, a split of the Summa into two classes (labels hard to
      read), the corrected totals and "Zwischen-Nutzungen" (planned thinning yields per period, in the
      Haubarkeitsertrag columns). Crossed-out numbers with corrected numbers above or below appear there: give the
      valid (not struck) value and mention the struck one in the note.
