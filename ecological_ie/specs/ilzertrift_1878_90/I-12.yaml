unit: I-12
title: Zusammenstellung aus dem Abschluß der Perioden- und Altersklassentabellen
summary: |
  Beilage I. 12 (Form F. XXV, "ad §§ 39 u. 41 Altersklassen- u. Periodentabelle"), Forstamt Schönberg: closing summary
  of the age-class and period tables of the 1878 Waldstandsrevision for the Ilzertrift-Komplex (Reviere Schönau,
  St. Oswald, Klingenbrunn), state "Term. a quo 1878". Only one block is filled: Betriebsklasse "Hochwald zu 144
  Jahren" (page 1). Each printed block holds two independent lists side by side: on the left the area of the age
  classes I–IV, unbestockt, produktiv, improduktiv (Hektar | Dez., percent of the productive area), on the right the
  six management periods I*–VI of the rotation with cut area (Angriffsfläche, ha), estimated final-felling yield
  (Haubarkeitsertrag, Ster; per ha), mean felling age, mean increment and estimated intermediate yield
  (Zwischennutzung, Ster). Below them the derivation of the yearly yield (Etat) in note lines. Page 3 is the same
  table marked "ungültig" (superseded, other Zwischennutzung figures); pages 2 and 4–8 are blank printed forms.
default_profile: table
default_form: xxv
pages:
  2:
    role: empty
    profile: skip
    note: blank printed form F. XXV (two empty Betriebsklasse blocks)
  3:
    role: other
    profile: skip
    note: |
