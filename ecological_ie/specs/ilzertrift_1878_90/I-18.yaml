      for new roads, "38848 = Meter 113382" for repairs): subtotal line as row_type sum, converted line as carry_over
      WITHOUT sets_key (unit Meter in the row note); from 1872 the lengths are in Meter. In the Naturalleistungen block
      only 1860/61 (16 days) and the money value (74 fl, 200 fl in 1861/62; 274 fl = 469,71 M) are filled.
