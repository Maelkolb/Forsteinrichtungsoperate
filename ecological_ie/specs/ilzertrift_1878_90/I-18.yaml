  culture_sums:
    name: Cap. II § 6 Forstculturen – Summe Titl. 4, Titl. 5 Übrige Kulturen und Verbesserungen, Summe § 6
    description: |
      Same row order as page 2 (years 1860/61 … 1877 in the first column, no 1867; sum after 1875 in fl., line
      "M. Pf." and converted sums as carry_over with sets_key unit = M; 1876–1877 in M.; final "Su" = grand total).
      Dots "." are empty. The Ruthen column of the ditches has a subtotal box after 1871 ("78 = Meter 228"): subtotal
      as row_type sum, converted line as carry_over without sets_key (unit Meter in the note). In the area column of
      the second Titl. 5 measure small second lines "auf/incl. 1,31 Saatbeete" give the part in nursery seed beds: put
      them into the row note. Under "Su" the area total is converted ("Hektar 2167,440 auf 13,002 Saatbeete"): note.
      The Naturalleistungen and Bemerkungen columns are empty (dots).
