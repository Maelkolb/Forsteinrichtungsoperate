map:
  expected: "Situation zum proj. Holzabfuhrweg durch Distr. VIII – planned wood-haulage road (red line with station numbers 1–82, Gesamtlänge 3085,1 m) through Distrikt VIII, with dashed contour lines and Abtheilung boundaries"
  places: "Abtheilungen 2 Östl. Föhrau, 3 Siebenruck, 4 Wasserriegel, 5 Rehhübel, 6 Gr. Ebene, 7 Sargau, 9 Hamerwald, 10 Hohe Scheitstatt, 11 Ob. Kohlstatthäng, 18 Ob. Stadlerruck, 20 …; existing Neuriedelhüttenweg (top right)"
  caveat: "lower half of the scan is masked by a grey rectangle; no scale, date or north arrow visible"
notes: |
  Headers read from the scans; uncertain: Titl. 1 ("Auf Culturaufseher"?, only Baarer Aufwand), the third seed column
  of the Laubholz-Ansaaten ("übrige Samen"?), and the second measure of Titl. 5 on page 3 ("Auf … Gegenstände", HTR
  "Unterhaltungs-Gegenstände"; area in Tagwerk with "incl. … Saatbeete", total 6361,22 Tagwerk = 2167,440 ha). The
  rows are years for the three Reviere together, not per Revier. Unit changes: money fl/kr → M/Pf from 1876;
  lengths Ruthen → Meter, Metzen → Hektoliter, Pfund → Kilogramm from 1872 (only the subtotals are converted, the
  column unit is not set by a heading). Row sums checked on the scan: 1860/61 roads 2935|7 + 713|47½ = 3648|54½;
  1873 Titl. 5 2|54 + 97|11 = 100|5.
