unit: I-18
title: Generelle Übersicht der Forstverbesserungen
summary: |
  Beilage I. 18 (Formular 28 / Formular 4 für Forstmeister, Forstamt Schönberg, 31 January 1879): general overview
  of the forest improvements in the Reviere Schönau, St. Oswald and Klingenbrunn during the III. Zeitabschnitt
  1860/61–1877, one row per year of use (the three Reviere together). Page 2 (Cap. II § 6 Forstculturen, Saaten und
  Pflanzungen): culture supervision, drainage, seed collection, broadleaf and conifer sowings and plantings with area
  (Tagwerk, new cultures and Nachbesserungen), seed quantities, plant numbers and costs; page 3: sums of Titl. 4,
  Titl. 5 (protection ditches and a further area-based measure), total of § 6 and services in kind; page 4: Cap. II
  § 4 Titl. 4 Holzabfuhrwege (new roads and repairs). Money in Gulden/Kreuzer until 1875, converted sum into Mark,
  1876–1877 in Mark/Pfennig; lengths in Ruthen and seeds in Metzen/Pfund until 1871, metric from 1872. Page 5 is a
  situation map of a projected wood-haulage road through Distr. VIII.
default_profile: table
default_form: cultures
pages:
  1:
    role: title
    profile: text
  2:
    note: Cap. II § 6 Forstculturen, Saaten und Pflanzungen (double page)
  3:
    form: culture_sums
    note: Cap. II § 6 continued – Summe Titl. 4, Titl. 5, Summe § 6, Naturalleistungen (double page)
  4:
    form: roads
    note: Cap. II § 4 Titl. 4 Holzabfuhrwege (double page), signed Schönberg 31 January 1879
  5:
    role: map
    profile: map
    note: lower half of the image is masked (grey rectangle)
forms:
  cultures:
    name: Cap. II § 6 Forstculturen – Saaten und Pflanzungen 1860/61–1877
    description: |
      Double page; one row per year in the first column ("Bezeichnung des Reviers, Forstamts" holds the years
      1860/61 … 1866/67, 1868 … 1877; there is no 1867). Dots "." are empty cells. Money pairs are fl. | kr. up to
      1875 (kr. with fractions like 21½). After 1875: a sum row of the money columns (sum, in fl.), a line "M. Pf."
      and the converted sums (carry_over, sets_key unit = M); 1876 and 1877 are in M. | Pf.; the final "Su" row is the
      grand total (sum, money in M). The lines "Hekt …" below "Su" convert the area sums into hectares: row_type note.
      Quantity columns change to metric units after 1871: between 1871 and 1872 small boxes give the subtotal
      1860/61–1871 of a quantity column (e.g. "47743" Ruthen in Titl. 2, "2,75" Metzen Bucheln, Pfund of conifer
      seed) and its conversion ("= Meter 139342", "= Hektoliter 1,09", "= Kilogramm …"). Give the subtotal line as
      row_type sum and the converted line as carry_over, but WITHOUT sets_key (sets_key unit is reserved for the
      currency); name the new unit in the row note. Small second lines "… in Saatbeeten" (part sown in nursery seed
      beds) under a value belong to that year's row: put them into the row note. Footnote "* in Pflanzkästen versetzte
      Laubholzpflanzen" refers to the Laubholzpflanzungen total.
    columns:
      - {id: year, label: "Bezeichnung des Reviers, Forstamts", type: period, meaning: "year of use"}
      - {id: t1_cost, label: "Titl. 1 › Auf Culturaufseher (?) › Baarer Aufwand › fl.", type: pair_major, unit: fl,
         variable: culture_supervision_cost, meaning: "cash expense, Titl. 1 (header uncertain); Mark from 1876"}
