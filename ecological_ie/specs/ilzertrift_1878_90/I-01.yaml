unit: I-01
title: Grundlagenprotokoll
summary: |
  Copy (Abschrift, Beil. Heft I.1) of the protocol of the meeting at St. Oswald on 15 October 1877 at which the
  Regierungs- und Kreisforstrat, Forstmeister Plaß (Forstamt Schönberg), the Oberförster Janke and Kühlwein and
  Forstamtsassistent Rosenbeck agreed the principles (Grundlagen) of the comprehensive Waldstandsrevision of the
  Reviere Klingenbrunn, St. Oswald and Schönau (Ilzertrift complex) with terminus a quo 1 January 1878. It reviews the
  earlier revisions (1837/38, 1848/49, 1859/60), the storm of 26 October 1870 and the bark beetle of 1874-76, and then
  sets out points I-IX: district and compartment formation, boundary marking, abolition of the separate Hochwald
  (Plenterwald) working class with the 144-year rotation kept, assessment of growing stock and yield, silviculture
  (spruce with fir and beech, fir sowing on windthrow areas, a dissenting vote of Forstmeister Plaß for beech groups, sparing seed-bearing
  maples), a systematic road network, a Triftbauplan for 1878/89, and litter use (Rechstreu); signatures follow.
  Position 14 is the circulation note of 18 October 1877 to the three Reviere; position 15 is the first page of a
  different document, the protocol of 14 July 1879 on the inspection of the projected road network.
