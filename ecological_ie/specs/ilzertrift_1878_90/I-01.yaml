notes: |
  Reading order = volume order (A 384 II 77-91); every page join was checked, e.g. 78 "Staatswaldcomplex des Reviers
  Klingenbrunn" -> 79 "mit der ...anlage vereinigt worden ist"; 80 "Waldhäuser im Reviere Schön-" -> 81 "au";
  82 "in keiner den Haubarkeitsertrag beeinträchtigenden Weise" -> 83 "beschädigt worden sind"; 83 "ist der" -> 84
  "Meinung"; 88 "Rinnsohlen" -> 89 "geeignet ... Bedacht zu nehmen". Segments: introduction and I [1-3], I-V [4-6],
  V-VII [7-9], VII-IX and signatures [10-13], appended pages [14-15].
  The HTR garbles the section numerals and headings: "Z." = I (Distriktsbildung), "Angebote" = II (Abtheilungen),
  "T." = III (Vermarkung), "II." on pos 7 = VI (Kulturbetrieb und Wirthschaftsweise), "Bekanntmachung" = VII
  (Waldwegbauten), "Leichtbautein" = VIII (Triftbauten), "Neunutzung" = IX (Streunutzung). Other misreadings:
  "Thalricht-", "Stadtricht-", "Thiericht-Complex" = Ilzertrift-Complex; "Teichtbauten" = Triftbauten;
  "Harzausnützung", "Harzsäue", "Dienstfrau", "Scheuerquanten" = Rechstreunutzung, Rechstreu, Nadelstreu,
  Streuquanten; "Formeister Raab" = Forstmeister Plaß (verified on the scan). Marginal notes in other hands (pos 2, 4, 7, 8, 13) are
  later remarks of the Regierung/Ministerium on the protocol, not part of the agreed text.
