forms:
  reduction:
    name: Ermittlung der allgemeinen Reduktionszahl (hartes / weiches Holz)
    description: |
      Checked against the 200 dpi scan (2026-10-05). Handwritten, no printed table (a faint grid shows through): two
      blocks with three column labels each, then a framed calculation. A double-underlined heading "Hartes Holz 33353,95
      Ster, hievon" (group_header, sets_key other = "Hartes Holz"; total quantity into the row note; in red a reviser
      wrote "Raummeter" above "Ster" and added "für Kubikmeter(?)" between red slashes – keep it in the note) is
      followed by the underlined column labels "Bau- Nutz- u. Werkholz: | Scheitholz: | Prügelholz:" and one data row
      with the percentage shares in black ink, underlined in red: 1,99 % | 93,52 % | 4,49 %. The same for "Weiches Holz
      570456,47 Ster, hievon" (same red addition): 58,89 % | 40,37 % | 0,74 %. Below, between double rules and split by
      a double vertical rule, two boxes that do not follow the three columns (one row_type note per box, its text in the
      first cell): left "Hartes Holz" 1,99 x 100 = 199,00; 93,52 x 91 = 8510,32; 4,49 x 80 = 359,20; 9068,52 / 3,1325 =
      28949 (written without comma); 2894,9 : 100 = 28,949; "Faktor = 29". Right "Weiches Holz" 58,89 x 100 = 5889,00;
      40,37 x 95 = 3835,15; 0,74 x 87 = 64,38; 9788,53 / 3,1325 = 3123,4, struck through in red and corrected to 3124,8;
      3123,4 : 100 = 31,234, corrected in red to 3124,8 and 31,248; "Faktor = 31.". The shares of one wood kind add up
      to 100 %. Outside the table: "Schönberg den 15 Juli 1878", "Kgl. Forstamt Schönberg" with seal and signature,
      "Rosenbeck k. Forstamts…" (title abbreviated), red "vdt. Kgl. Kreisforstbureau" with a red signature.
    columns:
    - id: share_timber
      label: Bau-, Nutz- u. Werkholz
      type: number
      unit: '%'
      variable: harvest_share_timber
      meaning: share of construction/utility timber in the 1874–1876 harvest of the wood kind; in the calculation block the
        weighting number 100
    - id: share_split
      label: Scheitholz
      type: number
      unit: '%'
      variable: harvest_share_split_fuelwood
      meaning: share of split fuelwood; weighting number 91 (hard) / 95 (soft)
    - id: share_round
      label: Prügelholz
      type: number
      unit: '%'
      variable: harvest_share_round_fuelwood
      meaning: share of round fuelwood; weighting number 80 (hard) / 87 (soft)
    observations:
      scope_keys:
      - other
      scope: Reviere Schönau, St. Oswald, Klingenbrunn, harvest 1874–1876, per wood kind
notes: |
  Pages 197–199 checked against the 200 dpi scans (2026-10-05). The scan reads "Hartes Holz 33353,95" (HTR: 33253,95;
  = 663,95 cbm + 31191 + 1499 Ster from the last Su row of page 198). Shares, products, sums and Faktoren recomputed
  from the scan values: all consistent. The meaning of the weighting numbers (100/91/80, 100/95/87) and of the divisor
  3,1325 is inferred: probably solid cubic feet per 100 stacked units and Ster per Bavarian Klafter, so the Faktor
  (29 hard, 31 soft) would be the solid content in cubic feet per Ster. The red addition after "Ster" is faint;
  "Raummeter" is certain, "für Kubikmeter" probable. The HTR marks the shares and "28949" as red: they are black ink
  with red underlining.
