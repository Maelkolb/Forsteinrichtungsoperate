unit: II-05
title: Ermittlung der allgemeinen Reduktionszahl
summary: |
  Beilage II.5 (A 384 II 197–199, checked on the scans; the same pages close II-04): derivation of the general reduction
  number (allgemeine Reduktionszahl) used in the Waldstandsrevision 1878/89 of the Reviere Schönau, St. Oswald and
  Klingenbrunn to convert the counted standing volumes (ausgezählte Bestandsmassen) into Ster. Page 197 is the title;
  page 198 (harvest 1874–1876 per Revier and assortment, extracted in II-04) gives the totals; page 199 splits the
  three-year harvest into hardwood (33353,95 Ster) and softwood (570456,47 Ster), computes the percentage shares of
  Bau-, Nutz- u. Werkholz, Scheitholz and Prügelholz, weights them with solid-content numbers (hard 100/91/80, soft
  100/95/87) and divides by 3,1325 (Ster per Klafter?) – result: Faktor 29 for hardwood, 31 for softwood. Signed
  Schönberg, 15 July 1878, Kgl. Forstamt Schönberg.
default_profile: table
default_form: reduction
