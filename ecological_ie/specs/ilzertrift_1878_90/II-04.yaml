unit: II-04
title: Zusammenstellung aus dem Abschluß der Materialergebnisse 1874, 1875 u. 1876 nach Sortimenten
summary: |
  Beilage II.4 (A 384 II 172–178 and 197–199): harvest of the years 1874, 1875 and 1876 by assortment, compiled to
  derive the general reduction number (allgemeine Reduktionszahl) for the Waldstandsrevision 1878/89 of the Reviere
  Schönau, St. Oswald and Klingenbrunn. Pages 172–177 are the report of the Revier St. Oswald (title page 172, register
  entries per year 1874–1876 on double pages, year summary 177 signed St. Oswald, 4 May 1878); page 178 is the title of
  the Beilage; page 198 (shared with II-05) sums all three Reviere per year. Assortments: Bau-, Nutz- u. Werkholz
  (hart, weich, Rinde) in Kubikmeter; Brennholz Scheitholz (hart, weich, Rinde) and Prügelholz (hart, weich) in Ster.
  Bark (Rinde) columns are in red ink. Only the St. Oswald detail is in this unit; the 1874 entries 1–30 (Seiten 1–2)
  are missing between pages 172 and 173.
default_profile: table
default_form: stoswald_1875
reading_order:
- 7
- 1
- 2
- 3
- 4
- 5
- 6
- 8
- 9
- 10
pages:
  1:
    role: title
    profile: text
    note: 'St. Oswald report title: ''Revier St. Oswald. Zusammenstellung der Materialergebnisse in den Etats-Jahren 1874,
      1875 u. 1876 behufs Ermittlung der allgemeinen Reductionszahl'' on an empty ruled form page; registry marks ''Exp. No.
      207, Pr. 5/7 78 No. 1069'', ''Jahr 1878'''
  2:
    form: stoswald_1874
    note: 1874, entries 31–46 (Seiten 3–4), page sums and 'Sa 1874'
  3:
    form: stoswald_1875
    note: 1875, entries 1–30 (Seiten 1–2)
  4:
    form: stoswald_1875
    note: 1875, entries 31–53 (Seiten 3–4), page sums and 'Sa 1875'
  5:
    form: stoswald_1876
    note: 1876, entries 1–25 (Seiten 1–2), page sums and 'Sa 1876'
  6:
    form: stoswald_years
    note: St. Oswald year summary 1874–1876, right page empty
  7:
    role: title
    profile: text
    note: title of Beilage II.4 for the three Reviere, Zeitabschnitt 1878/89
  8:
    role: title
    profile: skip
    note: title of Beilage II.5 (Reduktionszahl); extracted as text in II-05
  9:
    form: reviere
    note: summary of all three Reviere 1874–1876 (checked on the scan); also part of II-05, extracted only here
  10:
    role: other
    profile: skip
    note: calculation of the Reduktionszahl (checked on the scan); extracted in II-05
forms:
  stoswald_1874:
    name: Revier St. Oswald – Materialergebnisse 1874 nach Sortimenten (Register entries)
    description: |
      Revier St. Oswald, harvest of the year 1874 (page 173: entries 31–46). The image is a double page: left and right page carry
      the same printed header and the rows continue from the left page to the right page; read the left page first. One
      row = one numbered register entry (first column). Every value column is split into an integer column and a narrow
      decimal column (Kubik-Meter with two decimals; Ster mostly with "." or "00" in the decimal column). The two Rinde
      (bark) columns are written in red ink; dots are empty cells. Below the last entry of each page: the page sum,
      labelled "Seite 1." / "Seite 2." … in the blank columns at the right (row_type sum). On the last page of the year
      the earlier page sums follow, repeated ("„ 3.", "„ 2.", "„ 1.", row_type carry_over), and then the year total
      "Sa 1874" (row_type sum). The year is written as a heading ("1874.") or only in the total.
