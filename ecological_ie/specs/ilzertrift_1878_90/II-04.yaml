  Reading order: the Beilage title (page 7, A 384 II 178) is put first; the St. Oswald report (172–177) was bound before
  it. Pages 197–199 checked against the 200 dpi scans (2026-10-05). Their Beilage number is II.5 (title 197), but the
  per-Revier table 198 is the core summary of this unit; to avoid double counting it is extracted here and skipped in
  II-05, while the reduction calculation 199 is extracted only in II-05. Header doubts: the block name "Brenn- und
  Kohlholz" (HTR variously "Floßholz", "Reißholz", "Raffholz", "Kohlholz"; clearly "Brenn und Kohlholz" on 198), the
  rotated first header of the St. Oswald form ("…register No."), the HTR misreads the first column header of page 175 as
  "Mengen-Nr.". The St. Oswald 1874 register Seiten 1–2 (entries 1–30) are missing; their sums appear on page 173
  ("„ 1.", "„ 2."). On 198 (scan) St. Oswald 1876 Prügelholz weich reads 572 and the 1876
  Su 1576 (HTR 372 / 1376), matching page 177.
