  stoswald_years:
    name: Revier St. Oswald – Zusammenstellung 1874–1876 nach Sortimenten
    description: |
      Left page of a double page with the same printed header as the register pages; the right page is empty. The heading
      "Zusammenstellung." is written across the body. Rows: the years 1874, 1875, 1876 (handwritten "Jahr." at the top of
      the first column) with the year totals of the register pages, then "Sa." (row_type sum). Values are integer | decimal
      pairs; the Rinde columns in red ink. Under the Sa row two brackets give softwood plus bark: "150562,42 cbm"
      (weiches + Rinde of the Bau-, Nutz- u. Werkholz) and "101256,90 Ster" (Scheitholz weich + Rinde) – one row_type note.
      Signature outside the table: "St. Oswald, am 4ten Mai 1878, Königl. Oberförster" (name).
