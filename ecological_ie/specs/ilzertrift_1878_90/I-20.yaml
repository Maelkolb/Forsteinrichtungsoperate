      driven into the forest, money (full value, actual revenue split into two columns; fl. | kr. until 1875). Each year row
      has a second line in red ink with additional numbers: give them as red content of that year''s row (not as a separate
      row). A ''Su'' row after 1875 sums the Gulden values; the row below it (''= M. Pf.'') converts them into Mark (carry_over,
      sets_key unit = M); 1876 and 1877 are in Mark. Bottom: ''Su'' (sum) and ''jährlicher Durchschnitt'' (yearly average,
      row_type note).'
    columns:
    - id: year
      label: Jahr der Nutzung
      type: period
    - id: schoenau_area
