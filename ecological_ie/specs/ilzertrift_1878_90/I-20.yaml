unit: I-20
title: Weidenschafts- und Streunutzung 1861/87
summary: 'Beilage I. 20 (Forstamt Schönberg, 12 April 1879): grazing (Weidenschaft, p. 148) and litter use (Streunutzung,
  p. 149) in the Reviere Schönau, St. Oswald and Klingenbrunn, one row per year of use 1860/61–1877, the three Reviere as
  side-by-side column blocks. Areas are in Tagwerk (heading ''Tgw.''), money in Gulden/Kreuzer until 1875 and in Mark/Pfennig
  for 1876–1877 (heading ''M. Pf.'' after the conversion of the sums). Red numbers under the black values are later additions
  of the Forstamt.'
default_profile: table
default_form: weide
pages:
  1:
    role: title
    profile: text
  3:
    form: streu
forms:
  weide:
    name: Weidenschaft (grazing) 1860/61–1877
