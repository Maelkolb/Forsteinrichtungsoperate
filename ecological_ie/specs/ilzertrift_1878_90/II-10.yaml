      mode: digits
    - id: intermediate_faggots
      label: Zwischennutzung › Wellen-Hundert (Zusatz „resp. Ster“?, Lesung unsicher)
      type: pair_major
      unit: Hundert Wellen
      variable: harvest_intermediate_faggots
      meaning: brushwood bundles (Wellen), counted in hundreds
      scope: St. Oswald
    - id: intermediate_faggots_dec
      label: Zwischennutzung › Wellen-Hundert (Zusatz „resp. Ster“?, Lesung unsicher) › (Dezimalen)
      type: pair_minor
      of: intermediate_faggots
      mode: digits
    row_sums:
    - target: main_stemwood
      of:
      - main_timber
      - main_fuelwood
    - target: intermediate_stemwood
      of:
      - intermediate_timber
      - intermediate_fuelwood
    observations:
      scope_keys:
      - district_no
      - compartment_no
      scope: Revier St. Oswald, per District/Abtheilung, period 1860/61–1877
notes: |
  The task brief expected alternating left/right halves (header widths 21 and 11); the scans show that every page is a
  complete F. XIX form with its own header, and the width difference only comes from the HTR splitting or merging the
  decimal sub-columns. Only Revier St. Oswald is in this unit (one title page); there is no sum page. The suffix after
  "Wellen-Hundert" in the header is hard to read ("resp. Ster"?), the unit Hundert Wellen is assumed. Several Abtheilung
  names are uncertain in the HTR (e.g. p. 5 "Abtheilung 11 Kürchelbachleyrand", p. 29 "Abtheilung 21 Bärenloch").
