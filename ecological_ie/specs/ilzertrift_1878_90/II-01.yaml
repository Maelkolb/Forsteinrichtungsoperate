unit: II-01
title: Summarische Zusammenstellung des Taxations-Soll und Habens
summary: |
  Beilage II. 1 (Form No. XIII) "Summarische Zusammenstellung des Taxations-Solls u. Habens" for the complex of the
  Reviere Schönau, St. Oswald and Klingenbrunn (the words "Ilzertrift Complex" are crossed out on the title page). It
  is made at the end of the period 1860/77 and signed in Schönberg on 1 Sept 1878 (Königl. Forstamt Schönberg). One
  row is one Unterabtheilung with an Angriffshieb or Nachhauung. The row compares the estimated yield (Schätzung) with
  the actual yield (Ergebniß) and gives the surplus (Ueberschuß) or deficit. Areas are in hectares with three decimal
  digits: the printed "Tagw." is crossed out and replaced by "Hekt." on some pages. Wood is in Ster: the printed
  "Klafter" is crossed out everywhere. The Wellen columns are empty.
  Sections:
  (1) cuts completed in 1860/77: 1.) Angriffshiebe, 2.) Nachhauungen, with Revier groups a. Schönau, b. St. Oswald and
  c. Klingenbrunn;
  (2) a cancelled block "Auszugshauungen, Plänterhiebe und zufällige Ergebnisse";
  (3) "Verstärkende (?) Abgleichung" of unfinished cuts. Here a red/violet second number in the Ergebniß cell gives
  the material that was marked but is still standing;
  (4) Zusammenstellungen.
default_profile: table
default_form: xiii
