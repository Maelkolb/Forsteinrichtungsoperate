notes: |
  Reading order: the annotation order (138, 141, 142, 143, 135, 136, 139, 140, 144, 145, 146, 134) is wrong; the real
  order is the archive/volume order 134, 135, 136, 138, 139, ..., 146 = positions 1-12. Evidence: 134 is the title
  page (heading, date, attendance list, "1.)") and 146 the closing Beschluß. Page joins: 135 "es besteht ... nur die
  unbedeutende Differenz" -> 136 "von 73,99 Ster, welche ihren Grund ..."; 138 ends with the age-class table "zu Ende
  des verflossenen Zeitabschnittes" -> 139 "Gegenwärtig stellt sich dasselbe folgendermaßen dar"; 139 "die Spuren
  der" -> 140 "Beschädigungen ..."; 140 "nachdem die betreffenden Beständ[e]" -> 141 "größtentheils aus ... bestehen";
  141 "an die Forstverwaltung stellt," -> 142 "glaubt der unterzeichnete Regierungskommissär"; 142 "und sohin zur
  Etatserfüllung" -> 143 "von den in der I. Periode zu gewärtigenden Haubarkeitsbeträgen ..."; 143 "nicht befürworten
  zu können, da sich die ..." -> 144 "in den ihr zusagenden Lokalitäten ohnehin allerorts auf natürlichem Wege
  vermehrt"; 144 "ein Quantum" -> 145 "von 3790 Str"; 145 signatures -> 146 Beschluß. The point numbers run 1), 2) on
  134-136, 5) on 138, 6) on 140, 7) on 143.
  Gaps: 136 ends point 2 with a full stop ("anzubahnen.") while 138 starts mid-sentence inside point 4, so archive
  page 137 (points 3-4) is missing; it is not in any unit. The join 134 -> 135 ("Durch h. Reg. Min. Entschließung" ->
  "[...]fläche betrug für den sog. Ilzertriftkomplex 177,8 Tgw") is grammatically incomplete (probably words dropped by
  the copyist); no other page fits there.
  HTR misreadings: marginal "Beil. I. 24" = Beil. I. 21; "Thaltrift-", "Staniz-complex" = Ilzertrift-, Flanitzkomplex;
  "B)" on pos 3 = 2); "Sichtbungsplan" = Triftbauplan; "Verwendungsplan" = Streunutzungsplan; "Hmr", "Kr.", "Xtr",
  "Htr", "Str" = Ster. Pencil marginalia on pos 8-11 are later remarks of the reviewing Regierung (e.g. on the
  Nachhieb stock and on beech/larch sowing), not part of the protocol text.
