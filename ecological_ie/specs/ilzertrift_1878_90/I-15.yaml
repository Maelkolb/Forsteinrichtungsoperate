unit: I-15
title: Zusammenstellung des 1861/77 angefallenen Materials
summary: |
  One page (Beilage I.15, A 384 II 115, printed yield form No. XI used for a summary; Forstamt Schönberg, 18 August
  1878): total harvest of the Ilzertrift-Komplex during the period 1860/61–1877, one row per Revier (Schönau,
  St. Oswald, Klingenbrunn), split into Hauptnutzung and Zwischennutzung by assortment: Bau-, Nutz- u. Werkholz,
  Scheit- u. Prügelholz and their sum (Summa des Stammholzes), Stock- u. Lagerholz, all in Ster, and Wellen in
  hundreds. Below the three Revier rows: the sum row and, under a bracket, a grand total of Haupt- plus Zwischennutzung
  per assortment. Values are written in black with two decimals in a narrow sub-column and underlined in red.
default_profile: table
default_form: f11
forms:
  f11:
    name: Form XI (Materialanfall) – Zusammenstellung des im Ilzertrift-Complexe 1860/77 angefallenen Materiales
    description: |
      A printed single-stand yield form (top line "Distr. No. – Abtheil. No. – Unterabtheilung lit. – Tagw.", left unused;
      form number "XI." at the top right) used for a summary. The title "Zusammenstellung des im Ilzertrift-Complexe während
      des Zeitabschnittes 1860/77 angefallenen Materiales" is written across the body (heading row). Data rows: Schönau,
      St. Oswald, Klingenbrunn – the Revier names stand in the first column ("Jahre der Nutzung"). The next row (after a
      ruled line) is the sum of the three Reviere (row_type sum). The last row, under a bracket spanning both blocks,
      gives Hauptnutzung + Zwischennutzung per assortment, written in the Hauptnutzung columns (row_type note, label
      "Haupt- + Zwischennutzung"), e.g. 651038.05 + 14105.47 = 665143.52. Every value column has a narrow decimal
      sub-column: "198151 62" = 198151.62. Columns Ordnungs-Nummer, Spezielle Hiebsart and Angriffsfläche are empty.
      Red strokes under the numbers are check marks. Signature block (Schönberg, 18. August 1878, Kgl. Forstamt; red
      marginal note of the Forstmeister) is outside the table. Summa des Stammholzes = Bau-, Nutz- u. Werkholz +
      Scheit- u. Prügelholz in both blocks (198151.62 + 379158.80 = 577310.42).
