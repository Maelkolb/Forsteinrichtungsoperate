notes: |
  The HTR misreads several numbers (e.g. St. Oswald Zwischennutzung 2591.04 | 36007.45 | 38598.49 | 583.21, Klingenbrunn
  Hauptnutzung 187771.04, Zwischennutzung 10042.71 | 67274.72 | 77317.43 | 262.34) – check against the scan.
  Header doubts: "Stock- u. Lagerholz" (HTR "Lese-holz"), "Ordnungs-Nummer der Betriebsvorschreibung", and the word
  "Soll." in the unit row under the Hauptnutzung assortments (printed "Soll. … Ster").
