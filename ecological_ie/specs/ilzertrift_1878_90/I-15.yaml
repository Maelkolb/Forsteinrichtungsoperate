      label: Jahre der Nutzung
      type: key
      key: revier
      meaning: printed for the year of use; here it holds the Revier names Schönau, St. Oswald, Klingenbrunn
    - id: order_no
      label: Ordnungs-Nummer der Betriebsvorschreibung (?)
