notes: |
  Reading order: the annotation order ended 71, 74, 73, 72; the real order is the volume order (positions 35-38 =
  scans 71, 72, 73, 74). Scan 71 (p. 138) ends with "Triftbauplan des J. A. 1891/1902 schließt ab mit:" and a table;
  scan 72 (p. 140) continues with the rest of that table and "Mit dieser Ersparung können die beantragten
  Wegeausbauten ..." and ends "keine Änderung ergeben"; scan 73 (p. 142) continues the forest-rights/grazing discussion
  and ends with "Landshut im Dezember 1892"; scan 74 is the blank back cover. No reading_order needed.
  Segments break at the headings: Einleitung [1-4], I.1 comparison with the Etat [5-7], I.2 execution of the fellings
  [8-10], I.3 realised area and start of I.4 [11-13], I.4a history [14-17] and results of the last period [18-20],
  I.4b site [21-24, 25-27], road building [28-30, 31-33], road costs + VII Trift + VIII other matters [34-37].
  Gap: the manuscript jumps from p. 49 (pos 27) to p. 124 (pos 28) although archive scans 63/64 are consecutive, so
  pp. 50-123 were not photographed or are filed elsewhere (they contain the rest of I.4b and chapters II to VI; the
  text refers to "Ziff. III 3 Seite 117"). Archive scan A 385 40 is missing too, but without a text gap (pos 4 =
  pp. 2-3, pos 5 = pp. 4-5).
  The text is heavily revised: red and blue ink corrections, strike-outs and interlinear insertions; use the
  corrected reading. Marginal comments by the reviewing authority (e.g. "Referat ...", "gehört nicht hierher!
  uninteressant!!", "R.") are later remarks, not report text. HTR misreadings: "f. A. Reichenhall", "Ellingrbr.",
  "Klotzenbrunn", "[?]langruben" = F.A. Klingenbrunn; "Illertiss-", "Pfarrhof-", "Ihgertrift-", "Ilzerstift-komplex" =
  Ilzertriftkomplex; "Flunitz-", "Planitzkomplex" = Flanitz(trift)komplex; "Kieferfraß" = Käferfraß; heading I.3
  "Erörterungen über die wertheste Liebesbriefe" = "Erörterungen über die realisirte Hiebsfläche". Inline tables
  (Etat comparison per Forstamt, Nutzholz percentages, area accounts, lists of successful regenerations, road and
  Trift costs) are handled by the text extraction.
