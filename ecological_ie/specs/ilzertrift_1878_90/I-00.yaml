unit: I-00
title: Erörternde Darstellung
summary: |
  Bound volume (cover label dated 1891) with the "Erörternde Darstellung der Resultate der umfassenden
  Waldstandsrevision für den Ilzertriftkomplex, Term. a quo 1891", the discursive report that closes the period
  1878–1890 of the 1878 plan and introduces the new plan 1891/1902 for the k. Forstämter Klingenbrunn, St. Oswald and
  Schönau (signed Landshut, December 1892). Chapters present: cover and list of the 26 Beilagen; Einleitung (history of
  the revisions since 1837/38, delay after the storm of October 1870 and the bark-beetle years); I. results of the
  fellings: 1. Haupt-, Zwischen- and Gesamtnutzung against the Etat per Forstamt, Nutzholz share, prices and net
  revenue; 2. execution of Nachhiebe, Auszugshiebe, Angriffshiebe and Durchforstungen against the estimates; 3. the
  realised felling and regenerated area since 1837/38; 4a. management history (glassworks, Trift, Plenter- and
  Kahlhiebe, beech–fir–spruce mixture, successful and failed regenerations) and 4b. site description (boundaries,
  waters, altitudes, climate, geology, Rachelsee, soils, ground vegetation). After a gap in the volume follow the end of
  the road-building chapter (1878 road network, Lokalbahn Zwiesel–Grafenau, new Wegebauplan per Forstamt),
  VII. timber-floating structures and the new Triftbauplan, and VIII. other matters (forest rights, grazing, litter
  use). Units: Ster, Rm, Vfm/cbm, ha, Mark; historical figures in Tagwerk and fl.
